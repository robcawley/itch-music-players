<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Through the Cupola Player</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@500;700&family=Share+Tech+Mono&display=swap" rel="stylesheet">
<style>
/* Neon-noir night city: rain over a skyline waveform, amber haze below, pink neon title. */
:root{
  --bg:#06070d; --navy:#0e1126; --line:rgba(120,170,255,.16); --fg:#eef1ff; --muted:#8f97b8; --dim:#4a5274;
  --pink:#e2336f; --amber:#ff9a3c; --cyan:#59e1ff;
  --display:"Rajdhani","Arial Narrow",sans-serif;
  --mono:"Share Tech Mono",ui-monospace,Menlo,Consolas,monospace;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--bg);color:var(--fg);font:14px/1.4 var(--mono);overflow:hidden}
#sky{position:fixed;inset:0;width:100%;height:100%;display:block;z-index:0}
.haze{position:fixed;inset:0;z-index:1;pointer-events:none;
  background:
    radial-gradient(120% 60% at 50% 115%,rgba(255,140,50,.38),rgba(255,110,40,.10) 45%,transparent 70%),
    radial-gradient(90% 50% at 10% -10%,rgba(89,225,255,.12),transparent 60%),
    radial-gradient(70% 45% at 95% 0%,rgba(226,51,111,.14),transparent 60%);}
.scan{position:fixed;inset:0;z-index:5;pointer-events:none;opacity:.22;
  background:repeating-linear-gradient(0deg,rgba(0,0,0,.55) 0 1px,transparent 1px 3px)}
.vig{position:fixed;inset:0;z-index:4;pointer-events:none;box-shadow:inset 0 0 120px 30px rgba(0,0,0,.75)}
.wrap{position:relative;z-index:3;height:100%;max-width:680px;margin:0 auto;
  padding:18px max(16px,env(safe-area-inset-right,0px)) 14px max(16px,env(safe-area-inset-left,0px));
  display:flex;flex-direction:column;gap:12px}
header{display:flex;align-items:flex-start;justify-content:space-between;gap:12px}
.tag{font:700 12px/1 var(--display);letter-spacing:.22em;color:var(--amber);border:1px solid rgba(255,154,60,.6);padding:5px 8px 4px;
  text-shadow:0 0 8px rgba(255,154,60,.6);box-shadow:0 0 12px rgba(255,154,60,.18) inset}
.code{font-size:11px;color:var(--dim);letter-spacing:.12em;text-align:right;line-height:1.5;white-space:nowrap}
h1{margin:4px 0 0;font:700 clamp(28px,7.4vw,46px)/.95 var(--display);letter-spacing:.08em;text-transform:uppercase;color:#ffe3ee;
  text-shadow:0 0 4px #fff,0 0 12px var(--pink),0 0 28px var(--pink),0 0 60px rgba(226,51,111,.55)}
h1 .d{animation:flick 7s infinite}
@keyframes flick{0%,91%,93%,95%,100%{opacity:1}92%,94%{opacity:.35}}
.sub{font-size:12px;letter-spacing:.18em;color:var(--cyan);text-shadow:0 0 8px rgba(89,225,255,.5);text-transform:uppercase}
.spacer{flex:1;min-height:6px}
.deck{display:flex;align-items:center;gap:14px}
.big{appearance:none;flex:none;width:62px;height:62px;border-radius:50%;cursor:pointer;display:grid;place-items:center;
  background:rgba(6,7,13,.55);color:var(--amber);border:2px solid var(--amber);
  box-shadow:0 0 18px rgba(255,154,60,.45),inset 0 0 14px rgba(255,154,60,.25);transition:transform .15s}
.big:hover{transform:scale(1.05)}
.big svg{width:22px;height:22px;fill:currentColor;filter:drop-shadow(0 0 6px rgba(255,154,60,.8))}
.big .pause{display:none}.big.on .pause{display:block}.big.on .play{display:none}
.read{min-width:0;flex:1;display:flex;flex-direction:column;gap:3px}
.time{font-size:26px;letter-spacing:.06em;color:var(--fg);font-variant-numeric:tabular-nums;text-shadow:0 0 10px rgba(238,241,255,.35)}
.time small{font-size:14px;color:var(--muted)}
.status{font-size:11px;letter-spacing:.2em;color:var(--muted);text-transform:uppercase;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.status b{color:var(--cyan);font-weight:400}
.status .blink{display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--dim);margin-right:7px;vertical-align:0}
.on-air .status .blink{background:var(--pink);box-shadow:0 0 8px var(--pink);animation:bl 1.2s steps(2) infinite}
@keyframes bl{50%{opacity:.25}}
.city{position:relative;height:clamp(120px,30vh,190px);cursor:pointer;touch-action:none;border-bottom:1px solid rgba(255,154,60,.35)}
.city canvas{display:block;width:100%;height:100%}
.controls{display:flex;align-items:center;gap:18px;flex-wrap:wrap;color:var(--muted);font-size:12px;letter-spacing:.1em;text-transform:uppercase}
.controls label{display:flex;align-items:center;gap:8px;cursor:pointer}
input[type=checkbox]{accent-color:var(--pink);width:14px;height:14px;margin:0}
input[type=range]{accent-color:var(--amber);width:110px}
.keys{margin-left:auto;font-size:11px;color:var(--dim)}
footer{display:flex;justify-content:space-between;gap:8px 18px;flex-wrap:wrap;font-size:11.5px;color:var(--muted);border-top:1px solid var(--line);padding-top:10px}
footer a{color:var(--pink);text-decoration:none;text-shadow:0 0 8px rgba(226,51,111,.5)}
footer a:hover{text-decoration:underline}
button:focus-visible,a:focus-visible,input:focus-visible,.city:focus-visible{outline:2px solid var(--cyan);outline-offset:3px}
.err{color:var(--pink)}
@media (max-width:520px){.keys,.code{display:none}.time{font-size:22px}}
@media (prefers-reduced-motion:reduce){h1 .d,.on-air .status .blink{animation:none}}
</style>
</head>
<body>
<canvas id="sky" aria-hidden="true"></canvas>
<div class="haze"></div><div class="vig"></div><div class="scan"></div>
<div class="wrap">
  <header>
    <div>
      <span class="tag">FREE · ROYALTY-FREE</span>
      <h1>Through the <span class="d">C</span>upola</h1>
      <div class="sub">Rob Cawley · sci-fi space ambient · 6:20</div>
    </div>
    <div class="code">ORBITAL STN 07<br>OBS DECK · CUPOLA<br>LOCAL 02:41</div>
  </header>
  <div class="spacer"></div>
  <div class="deck">
    <button class="big" id="big" aria-label="Play">
      <svg class="play" viewBox="0 0 20 20"><path d="M5 3l12 7-12 7z"/></svg>
      <svg class="pause" viewBox="0 0 20 20"><rect x="4" y="3" width="4" height="14" rx="1"/><rect x="12" y="3" width="4" height="14" rx="1"/></svg>
    </button>
    <div class="read">
      <div class="time" id="time">00:00 <small>/ 06:20</small></div>
      <div class="status" id="status"><span class="blink"></span><b>STANDBY</b> · press play to open the window</div>
    </div>
  </div>
  <div class="city" id="city" tabindex="0" role="slider" aria-label="Seek" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0"><canvas id="cv"></canvas></div>
  <div class="controls">
    <label for="loop"><input type="checkbox" id="loop"> Loop</label>
    <label for="vol">Volume <input type="range" id="vol" min="0" max="1" step="0.01" value="0.85"></label>
    <span class="keys">space · ← → seek</span>
  </div>
  <footer>
    <span>Preview is 160 kbps MP3. The download has WAV and OGG.</span>
    <a href="https://robcawley.com/roomtone/?src=itch-cupola-player" target="_blank" rel="noopener">Hear Room Tone, my new album →</a>
  </footer>
</div>
<script>
(() => {
  const $ = id => document.getElementById(id);
  const fmt = s => { s = Math.max(0, Math.floor(s||0)); return String(Math.floor(s/60)).padStart(2,"0") + ":" + String(s%60).padStart(2,"0"); };
  const still = matchMedia("(prefers-reduced-motion: reduce)").matches;
  const audio = new Audio(); audio.preload = "metadata"; audio.volume = 0.85;
  let track = null, dragging = false, ac = null, an = null, buf = null, level = 0;
  const LINES = ["the window is open","earth turning below","holding orbit","signal clear","night side approaching","drift"];

  // Optional level meter: drives rain density and window flicker. Playback works without it.
  function meter(){
    if (ac || !window.AudioContext && !window.webkitAudioContext) return;
    try {
      ac = new (window.AudioContext || window.webkitAudioContext)();
      const src = ac.createMediaElementSource(audio); an = ac.createAnalyser(); an.fftSize = 512;
      src.connect(an); an.connect(ac.destination); buf = new Uint8Array(an.fftSize);
    } catch(e){ an = null; }
  }
  function play(){ meter(); if (ac && ac.state === "suspended") ac.resume(); audio.play().catch(()=>{}); }
  function toggle(){ if (audio.paused) play(); else audio.pause(); }

  function render(){
    const on = !audio.paused;
    $("big").classList.toggle("on", on); $("big").setAttribute("aria-label", on ? "Pause" : "Play");
    document.body.classList.toggle("on-air", on);
    if (!on && audio.currentTime > 0 && !audio.ended) $("status").innerHTML = '<span class="blink"></span><b>HOLD</b> · paused';
  }

  // Background: rain and a slow light crossing the sky.
  const sky = $("sky"), sx = sky.getContext("2d");
  let drops = [], craft = {x:-0.1, y:0.16, v:0.00012};
  function sizeSky(){ const d = devicePixelRatio || 1; sky.width = innerWidth*d; sky.height = innerHeight*d; }
  addEventListener("resize", sizeSky); sizeSky();
  for (let i = 0; i < 260; i++) drops.push({x:Math.random(), y:Math.random(), l:0.02+Math.random()*0.05, v:0.006+Math.random()*0.01, a:0.08+Math.random()*0.25});
  function drawSky(){
    const W = sky.width, H = sky.height, d = devicePixelRatio || 1;
    sx.clearRect(0,0,W,H);
    const n = Math.floor(90 + 170 * Math.min(1, 0.35 + level*1.6));
    sx.lineWidth = 1*d;
    for (let i = 0; i < n; i++){
      const p = drops[i];
      if (!still){ p.y += p.v; p.x -= p.v*0.18; if (p.y > 1.05){ p.y = -0.08; p.x = Math.random()*1.15; } if (p.x < -0.05) p.x += 1.1; }
      sx.strokeStyle = `rgba(150,200,255,${p.a})`;
      sx.beginPath(); sx.moveTo(p.x*W, p.y*H); sx.lineTo((p.x - p.l*0.18)*W, (p.y + p.l)*H); sx.stroke();
    }
    if (!still){ craft.x += craft.v; if (craft.x > 1.1){ craft.x = -0.1; craft.y = 0.08 + Math.random()*0.2; } }
    const cxp = craft.x*W, cyp = craft.y*H, blink = (performance.now() % 1400) < 140;
    sx.fillStyle = "rgba(255,170,90,.9)"; sx.fillRect(cxp, cyp, 2*d, 2*d);
    if (blink){ sx.fillStyle = "rgba(226,51,111,1)"; sx.beginPath(); sx.arc(cxp+6*d, cyp+1*d, 2.2*d, 0, 7); sx.fill(); }
    const g = sx.createLinearGradient(cxp, cyp, cxp - 60*d, cyp + 120*d); g.addColorStop(0, "rgba(255,200,140,.10)"); g.addColorStop(1, "rgba(255,200,140,0)");
    sx.fillStyle = g; sx.beginPath(); sx.moveTo(cxp, cyp); sx.lineTo(cxp - 90*d, cyp + 140*d); sx.lineTo(cxp - 20*d, cyp + 150*d); sx.fill();
  }

  // Skyline waveform: each building is a slice of the track. Played blocks light up amber.
  const cv = $("cv"), c2 = cv.getContext("2d");
  let towers = [];
  function sizeCity(){ const r = cv.getBoundingClientRect(), d = devicePixelRatio || 1; cv.width = Math.round(r.width*d); cv.height = Math.round(r.height*d); }
  new ResizeObserver(sizeCity).observe(cv); sizeCity();
  function buildTowers(pk){
    let seed = 7; const rnd = () => (seed = (seed*16807) % 2147483647) / 2147483647;
    towers = pk.map(p => ({h:0.12 + 0.86*Math.pow(p,0.9), w:0.6 + rnd()*0.38, spire:rnd() < 0.12, win:Array.from({length:40}, () => rnd())}));
  }
  function drawCity(){
    const W = cv.width, H = cv.height, d = devicePixelRatio || 1;
    c2.clearRect(0,0,W,H);
    if (!towers.length) return;
    const dur = audio.duration || track.seconds, ph = Math.min(1, (audio.currentTime||0) / dur);
    const n = towers.length, bw = W / n, t = performance.now()/1000;
    for (let i = 0; i < n; i++){
      const tw = towers[i], played = (i+0.5)/n < ph;
      const h = tw.h * (H - 14*d), w = Math.max(2, bw*tw.w), x = i*bw + (bw - w)/2, y = H - h;
      c2.fillStyle = played ? "#160f17" : "#0b0e1d";
      c2.fillRect(x, y, w, h);
      if (tw.spire){ c2.fillRect(x + w/2 - d, y - 10*d, 2*d, 10*d);
        if (Math.sin(t*2 + i) > 0.6){ c2.fillStyle = "#e2336f"; c2.fillRect(x + w/2 - 1.5*d, y - 12*d, 3*d, 3*d); } }
      // windows
      const cols = Math.max(1, Math.floor(w / (4*d))), rows = Math.floor(h / (6*d));
      for (let r = 0; r < rows; r++) for (let c = 0; c < cols; c++){
        const k = tw.win[(r*cols + c) % 40];
        const lit = played ? k > 0.35 - level*0.5 : k > 0.9;
        if (!lit) continue;
        c2.fillStyle = played ? (k > 0.93 ? "rgba(89,225,255,.85)" : `rgba(255,${150 + Math.floor(k*60)},70,${0.55 + k*0.4})`) : "rgba(110,130,200,.28)";
        c2.fillRect(x + 1*d + c*4*d, y + 3*d + r*6*d, 2*d, 2*d);
      }
    }
    // searchlight playhead
    const px = Math.round(ph*W);
    const g = c2.createLinearGradient(px, H, px, 0); g.addColorStop(0, "rgba(255,190,120,.55)"); g.addColorStop(1, "rgba(255,190,120,0)");
    c2.fillStyle = g; c2.beginPath(); c2.moveTo(px - 2*d, H); c2.lineTo(px - 22*d, 0); c2.lineTo(px + 22*d, 0); c2.lineTo(px + 2*d, H); c2.fill();
    c2.fillStyle = "#ffd9b0"; c2.fillRect(px - d, 0, 2*d, H);
    $("city").setAttribute("aria-valuenow", Math.round(ph*100));
  }

  function tick(){
    if (an && !audio.paused){ an.getByteTimeDomainData(buf); let s = 0; for (const v of buf){ const x = (v-128)/128; s += x*x; } level = level*0.85 + Math.sqrt(s/buf.length)*0.15*3; }
    else level *= 0.95;
    if (track){
      $("time").innerHTML = `${fmt(audio.currentTime)} <small>/ ${fmt(audio.duration || track.seconds)}</small>`;
      if (!audio.paused){ const k = Math.floor((audio.currentTime||0) / 45) % LINES.length; $("status").innerHTML = `<span class="blink"></span><b>LIVE</b> · ${LINES[k]}`; }
      drawCity();
    }
    drawSky();
    requestAnimationFrame(tick);
  }

  function seekAt(x){
    const r = cv.getBoundingClientRect(), f = Math.min(1, Math.max(0, (x - r.left) / r.width));
    const go = () => { audio.currentTime = f * (audio.duration || track.seconds); };
    if (audio.readyState < 1){ audio.addEventListener("loadedmetadata", go, {once:true}); play(); }
    else { go(); if (audio.paused) play(); }
  }
  $("city").addEventListener("pointerdown", e => { dragging = true; $("city").setPointerCapture(e.pointerId); seekAt(e.clientX); });
  $("city").addEventListener("pointermove", e => { if (dragging) seekAt(e.clientX); });
  $("city").addEventListener("pointerup", () => dragging = false);
  audio.addEventListener("play", render); audio.addEventListener("pause", render);
  audio.addEventListener("ended", () => { $("status").innerHTML = '<span class="blink"></span><b>END</b> · the window closes'; render(); });
  audio.addEventListener("error", () => { $("status").innerHTML = '<span class="err">Couldn\'t load the track. Check your connection and try again.</span>'; });
  $("big").onclick = toggle;
  $("loop").onchange = e => { audio.loop = e.target.checked; };
  $("vol").oninput = e => { audio.volume = +e.target.value; };
  document.addEventListener("keydown", e => {
    if (e.target.tagName === "INPUT") return;
    if (e.code === "Space"){ e.preventDefault(); toggle(); }
    else if (e.key === "ArrowRight"){ audio.currentTime = Math.min((audio.duration||0) - 0.5, audio.currentTime + 10); }
    else if (e.key === "ArrowLeft"){ audio.currentTime = Math.max(0, audio.currentTime - 10); }
  });

  fetch("track.json").then(r => r.json()).then(t => {
    track = t; audio.src = t.file; buildTowers(t.peaks); requestAnimationFrame(tick);
  }).catch(() => { $("status").innerHTML = '<span class="err">Couldn\'t load the track. Reload the page to try again.</span>'; requestAnimationFrame(tick); });
})();
</script>
</body>
</html>
